    html.push('<div class="sum-card span-6"><h3>Where is my usage?</h3>');
    for(const r of projectRows){ html.push('<div class="project-row"><div class="project-name" title="'+escapeAttr(r.name)+'">'+escapeHtml(r.name)+'</div><div class="bar"><div style="width:'+r.pct.toFixed(1)+'%"></div></div><div class="project-pct">'+Math.round(r.pct)+'% · '+fmtNum(r.tokens)+'</div></div>'); }
    html.push('<div class="insight"><div class="eyebrow">Biggest concentration</div><div class="headline">'+escapeHtml(projectRows[0].name)+' accounts for '+Math.round(projectRows[0].pct)+'% of your tracked tokens.</div><div class="copy">If you want to reduce usage, this is the first project worth investigating rather than optimising everything equally.</div></div></div>');
  } else {
    const topOffenders = computeTopOffendingPrompts(inScope, 3);
    html.push('<div class="sum-card span-6"><h3>Worst offending prompts</h3>');
    if (!topOffenders.length) {
      html.push('<div class="sum-empty" style="padding:12px 0;background:none;border:0">No token-heavy prompts stand out in this time window.</div>');
    } else {
      topOffenders.forEach((p, i) => {
        const promptId = p.sid + "-" + p.root._idx;
        const clarityBadge = p.needsClarity
          ? '<span class="offender-flag" title="The response looks like it asked for more context or clarification">Needed clarification</span>'
          : '';
        html.push(
          "<div class='offender-row' onclick='jumpToPrompt(" + JSON.stringify(p.sid) + "," + JSON.stringify(promptId) + ")'>" +
            '<div class="offender-rank">#' + (i + 1) + '</div>' +
            '<div class="offender-body">' +
              '<div class="offender-prompt">' + escapeHtml(shorten(p.root.prompt || "(empty prompt)", 90)) + '</div>' +
              '<div class="offender-meta">' + escapeHtml(p.sessionTitle) + ' · ' + p.decisions + ' action' + (p.decisions === 1 ? '' : 's') + clarityBadge + '</div>' +
            '</div>' +
            '<div class="offender-tok">' + fmtNum(p.tokens) + ' tok</div>' +
          '</div>'
        );
      });
    }
    html.push('<div class="sum-sub" style="margin-top:10px">Ranked by total tokens for that prompt. Click one to jump to it.</div></div>');
  }

  if(topTools.length){ html.push('<div class="sum-card span-6"><h3>Most used tools</h3>'); for(const [name,count] of topTools){ html.push('<div class="bar-row"><div class="lab"><span class="k">'+escapeHtml(name)+'</span><span class="v">'+count+'</span></div><div class="bar"><div style="width:'+((count/maxTool)*100).toFixed(1)+'%"></div></div></div>'); } html.push('</div>'); }

  html.push('<div class="sum-card span-12"><h3>What are you actually doing?</h3><div class="activity-chart">');
  for(const [name,count] of activityRows){ const pct=count/maxActivity; html.push('<div class="activity-col"><div class="activity-val">'+count+'</div><div class="activity-bar" style="height:'+Math.max(6,pct*105)+'px"></div><div class="activity-name">'+escapeHtml(name)+'</div></div>'); }
  html.push('</div><div class="sum-sub" style="margin-top:10px">Prompt categories are inferred from prompt text, so treat them as useful trends rather than sacred truth. <b>Other</b> is the catch-all bucket for prompts that don\'t clearly match one of the named categories.</div></div>');

  html.push('</div></div>');
  root.innerHTML=html.join('');
}

function turnTokenTotal(e) {
  return (e.input_tokens || 0) + (e.output_tokens || 0) +
         (e.cache_creation || 0) + (e.cache_read || 0);
}

// The "new" cost of a turn, excluding cache reads. cache_read reflects context
// reused from earlier in the conversation (it grows every turn regardless of
// what that specific turn actually did), so including it makes later actions
// in a long prompt look artificially expensive - like a running total rather
// than the cost of that one action.
function turnFreshTokens(e) {
  return (e.input_tokens || 0) + (e.output_tokens || 0) +
         (e.cache_creation || 0) + (e.thinking_tokens || 0);
}

function buildTokenBreakdown(g) {
  const total = g.inputTokens + g.outputTokens + g.cacheCreate + g.cacheRead + g.thinkingTokens;
  const segments = [
    ["Input",         g.inputTokens,    "tb-input"],
    ["Cache read",    g.cacheRead,      "tb-cacheread"],
    ["Cache created", g.cacheCreate,    "tb-cachecreate"],
    ["Output",        g.outputTokens,   "tb-output"],
    ["Thinking",      g.thinkingTokens, "tb-thinking"],
  ].filter(s => s[1] > 0);

  const wrap = document.createElement("div");
  wrap.className = "token-breakdown";

  const label = document.createElement("div");
  label.className = "pf-label-row";
  label.innerHTML = '<div class="pf-label">Tokens</div><span class="pf-tok"></span>';
  label.querySelector(".pf-tok").textContent = fmtNum(total) + " tok total";
  wrap.appendChild(label);

  const bar = document.createElement("div");
  bar.className = "tb-bar";
  for (const [name, val, cls] of segments) {
    const seg = document.createElement("div");
    seg.className = "tb-seg " + cls;
    seg.style.width = ((val / total) * 100).toFixed(2) + "%";
    seg.title = name + ": " + val.toLocaleString() + " tokens";
    bar.appendChild(seg);
  }
  wrap.appendChild(bar);

  const legend = document.createElement("div");
  legend.className = "tb-legend";
  for (const [name, val, cls] of segments) {
    const item = document.createElement("div");
    item.className = "tb-legend-item";
    item.innerHTML = '<span class="tb-dot ' + cls + '"></span><span class="tb-name"></span><span class="tb-val"></span>';
    item.querySelector(".tb-name").textContent = name;
    item.querySelector(".tb-val").textContent = fmtNum(val);
    legend.appendChild(item);
  }
  wrap.appendChild(legend);

  return wrap;
}

function hexToRgb(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function lerpColor(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  const r = Math.round(pa.r + (pb.r - pa.r) * t);
  const g = Math.round(pa.g + (pb.g - pa.g) * t);
  const bl = Math.round(pa.b + (pb.b - pa.b) * t);
  return "rgb(" + r + "," + g + "," + bl + ")";
}
// pct 0-100: 0 -> low color, 50 -> mid color, 100 -> high color
function threeStopColor(pct, low, mid, high) {
  const t = Math.max(0, Math.min(100, pct)) / 100;
  return t <= 0.5 ? lerpColor(low, mid, t / 0.5) : lerpColor(mid, high, (t - 0.5) / 0.5);
}
const TOKEN_GRADIENT  = ["#e6edf3", "#f5d020", "#e7442a"];  // white -> yellow -> red
const ACTION_GRADIENT = ["#e6edf3", "#e666ff", "#e7442a"];  // white -> pink -> red

function drawTree(evs, newFromIndex, sid, sortMode) {
  // Split events into groups, one per user prompt.
  const groups = [];
  let current = null;
  const preByTool = new Map();
  let pendingTools = [];   // tool nodes emitted since the last AssistantTurn, same turn
  const freshGroup = () => ({
    root: null, tools: [], models: new Map(), efforts: new Map(), tokens: 0,
    inputTokens: 0, outputTokens: 0, cacheCreate: 0, cacheRead: 0, thinkingTokens: 0,
    responseParts: []
  });
  for (const e of evs) {
    if (e.event === "UserPromptSubmit") {
      current = freshGroup();
      current.root = e;
      groups.push(current);
      pendingTools = [];
    } else if (e.event === "PreToolUse") {
      const n = { id: "n-" + e._idx, kind: "tool", label: e.tool_name || "tool",
                  event: e, done: false, isNew: e._idx >= newFromIndex, turnTokens: 0 };
      if (!current) { current = freshGroup(); groups.push(current); }
      current.tools.push(n);
      pendingTools.push(n);
      if (e.tool_use_id) preByTool.set(e.tool_use_id, n);
    } else if (e.event === "PostToolUse") {
      const match = e.tool_use_id ? preByTool.get(e.tool_use_id) : null;
      if (match) { match.done = true; match.post = e; }
    } else if (e.event === "AssistantTurn") {
      if (!current) { current = freshGroup(); groups.push(current); }
      if (e.model) current.models.set(e.model, (current.models.get(e.model) || 0) + 1);
      if (e.effort) current.efforts.set(e.effort, (current.efforts.get(e.effort) || 0) + 1);
      const turnTok = turnTokenTotal(e);
      const freshTok = turnFreshTokens(e);
      current.tokens += turnTok;
      current.inputTokens   += e.input_tokens || 0;
      current.outputTokens  += e.output_tokens || 0;
      current.cacheCreate   += e.cache_creation || 0;
      current.cacheRead     += e.cache_read || 0;
      current.thinkingTokens += e.thinking_tokens || 0;
      if (e.response_text) current.responseParts.push(e.response_text);
      // Attribute this turn's cost to every tool call it produced. Use the
      // "fresh" (non-cache-read) figure so later actions in a long prompt
      // don't look artificially expensive just because context has grown.
      for (const n of pendingTools) { n.turnTokens = freshTok; n.turnFullTokens = turnTok; n.turnUsage = e; }
      pendingTools = [];
    }
  }

  const container = document.createElement("div");
  container.className = "prompts";

  // Session-wide maxes so per-prompt bars/gradients are relative to this session.
  const maxDec = groups.reduce((m, g) => Math.max(m, g.tools.length), 0);
  const maxTokensInSession = groups.reduce((m, g) => Math.max(m, g.tokens), 0);

  // Rough per-prompt timing: start = the prompt's own timestamp, end = the last
  // tool event timestamp within it (falls back to the start when there are no tools).
  for (const g of groups) {
    g.startTs = g.root ? g.root.ts : (g.tools.length ? g.tools[0].event.ts : 0);
    g.endTs = g.tools.length ? g.tools[g.tools.length - 1].event.ts : g.startTs;
    g.duration = Math.max(0, g.endTs - g.startTs);
  }

  const mode = sortMode || "latest";
  let ordered;
  if (mode === "tokens") {
    ordered = groups.slice().sort((a, b) => b.tokens - a.tokens);
  } else if (mode === "duration") {
    ordered = groups.slice().sort((a, b) => b.duration - a.duration);
  } else {
    // Latest prompt at the top (reverse chronological)
    ordered = groups.slice().reverse();
  }
  for (const g of ordered) {
    const promptId = sid + "-" + (g.root ? g.root._idx : "cont-" + groups.indexOf(g));
    const isOpen = expandedPrompts.has(promptId);
    const label = g.root ? shorten(g.root.prompt || "(empty prompt)", 32) : "(continued)";

    const item = document.createElement("div");
    item.className = "prompt-group" + (isOpen ? " expanded" : "");
    item.dataset.promptId = promptId;

    const head = document.createElement("div");
    head.className = "prompt-head";
    const modelsHere = Array.from(g.models.entries()).sort((a, b) => b[1] - a[1]);
    let modelChip = "";
    if (modelsHere.length === 1) {
      modelChip = '<div class="model-chip">' + escapeHtml(prettyModel(modelsHere[0][0])) + '</div>';
    } else if (modelsHere.length > 1) {
      const mostUsed = prettyModel(modelsHere[0][0]);
      const others = modelsHere.slice(1).map(m => prettyModel(m[0])).join(", ");
      modelChip = '<div class="model-chip mixed" title="' + escapeAttr("Also: " + others) + '">' +
                  escapeHtml(mostUsed) + '<span class="plus">+' + (modelsHere.length - 1) + '</span></div>';
    }

    const effortsHere = Array.from(g.efforts.entries()).sort((a, b) => b[1] - a[1]);
    const primaryEffort = effortsHere.length ? effortsHere[0][0] : null;
    let reasoningChip = "";
    if (primaryEffort) {
      const mixedEffort = effortsHere.length > 1;
      const effortLabel = primaryEffort.charAt(0).toUpperCase() + primaryEffort.slice(1);
      reasoningChip = '<div class="reasoning-chip reasoning-' + primaryEffort + '"' +
        (mixedEffort ? ' title="' + escapeAttr("Also used: " + effortsHere.slice(1).map(e => e[0]).join(", ")) + '"' : '') +
        '>' + escapeHtml(effortLabel) + (mixedEffort ? '<span class="plus">+' + (effortsHere.length - 1) + '</span>' : '') + '</div>';
    }

    const dec = g.tools.length;
    const pct = maxDec > 0 ? Math.round((dec / maxDec) * 100) : 0;
    const actionColor = threeStopColor(pct, ACTION_GRADIENT[0], ACTION_GRADIENT[1], ACTION_GRADIENT[2]);
    let effortHint = dec + " action" + (dec === 1 ? "" : "s");
    if (dec >= 20) { effortHint += " · thought hard"; }
    else if (dec >= 10 || (maxDec >= 8 && pct >= 75)) { effortHint += " · heavy"; }
    const effortBlock =
      '<div class="prompt-effort" title="' + escapeAttr(effortHint) + '">' +
        '<div class="pe-line">' +
          '<span class="pe-num" style="color:' + actionColor + '">' + dec + '</span>' +
          '<span class="pe-lab">' + (dec === 1 ? "action" : "actions") + '</span>' +
        '</div>' +
        '<div class="pe-bar"><div style="width:' + pct + '%;background:' + actionColor + '"></div></div>' +
      '</div>';

    const tokenPct = maxTokensInSession > 0 ? Math.round((g.tokens / maxTokensInSession) * 100) : 0;
    const tokenColor = threeStopColor(tokenPct, TOKEN_GRADIENT[0], TOKEN_GRADIENT[1], TOKEN_GRADIENT[2]);
    const tokenChip = g.tokens > 0
      ? '<div class="token-chip" style="color:' + tokenColor + ';border-color:' + tokenColor + '" title="' + escapeAttr(g.tokens.toLocaleString() + " tokens this prompt") + '">' +
          fmtNum(g.tokens) + ' tok</div>'
      : "";

    // Work out up front whether this prompt has an improvement insight, so we
    // can show a tick/cross next to the action count even while collapsed.
    const responseTextForCheck = g.responseParts.join("\n\n").trim();
    const suggestion = suggestionForPrompt(g, responseTextForCheck, primaryEffort);
    const suggestionBadge = (suggestion && suggestion.tone === "bad")
      ? '<span class="suggestion-flag flag-bad" title="' + escapeAttr(suggestion.text) + '">&#10007;</span>'
      : '<span class="suggestion-flag flag-good" title="' + escapeAttr(suggestion ? suggestion.text : "No improvement insight for this prompt") + '">&#10003;</span>';

    head.innerHTML =
      '<div class="prompt-dot"></div>' +
      '<div class="prompt-text"></div>' +
      modelChip +
      reasoningChip +
      tokenChip +
      effortBlock +
      suggestionBadge +
      '<div class="chevron">&#x203A;</div>';
    head.querySelector(".prompt-text").textContent = label;
    head.onclick = () => {
      if (expandedPrompts.has(promptId)) expandedPrompts.delete(promptId);
      else expandedPrompts.add(promptId);
      renderCanvas(0);
    };
    item.appendChild(head);

    if (isOpen) {
      const body = document.createElement("div");
      body.className = "prompt-body";

      // Full prompt text, uncollapsed, above the timeline.
      const promptFull = document.createElement("div");
      promptFull.className = "prompt-full";
      promptFull.innerHTML = '<div class="pf-label">Prompt</div><div class="pf-text"></div>';
      promptFull.querySelector(".pf-text").textContent = g.root ? (g.root.prompt || "(empty prompt)") : "(continued from a previous prompt)";
      body.appendChild(promptFull);

      if (g.tokens > 0) body.appendChild(buildTokenBreakdown(g));

      if (g.tools.length === 0) {
        const none = document.createElement("div");
        none.style.cssText = "color:var(--muted);font-size:12px;margin:10px 0";
        none.innerHTML = "<em>No tool calls in this turn.</em>";
        body.appendChild(none);
      } else {
        const scroll = document.createElement("div");
        scroll.className = "tl-wrap";
        scroll.appendChild(buildToolTimeline(g.tools));
        body.appendChild(scroll);
        const legend = buildTimelineLegend(g.tools);
        if (legend) body.appendChild(legend);
      }

      // Claude's response text, below the timeline.
      const respBlock = document.createElement("div");
      respBlock.className = "prompt-response";
      respBlock.innerHTML = '<div class="pf-label">Response</div><div class="pf-text"></div>';
      respBlock.querySelector(".pf-text").textContent = responseTextForCheck || "(no text response - tool calls only)";
      body.appendChild(respBlock);

      if (suggestion) {
        const tip = document.createElement("div");
        tip.className = "prompt-tip " + (suggestion.tone === "good" ? "tip-good" : "tip-bad");
        tip.innerHTML = '<div class="pf-label">' + (suggestion.tone === "good" ? "Looks reasonable" : "Insight") + '</div><div class="tip-text"></div>';
        tip.querySelector(".tip-text").textContent = suggestion.text;
        body.appendChild(tip);
      }

      item.appendChild(body);
    }

    container.appendChild(item);
  }
  return container;
}

function showDetail(n) {
  const e = n.event;
  const rows = [
    ["Event", e.event],
    ["Time",  new Date(e.ts * 1000).toLocaleTimeString()],
  ];
  if (e.tool_name)   rows.push(["Tool",   e.tool_name]);
  if (e.tool_use_id) rows.push(["Tool ID", e.tool_use_id]);
  if (n.done)        rows.push(["Status",  "Completed"]);
  if (n.turnUsage) {
    const u = n.turnUsage;
    rows.push(["", ""]);
    rows.push(["Tokens (new work only)", ""]);
    rows.push(["  Model",         prettyModel(u.model)]);
    rows.push(["  Input",         fmtNum(u.input_tokens)]);
    rows.push(["  Output",        fmtNum(u.output_tokens)]);
    rows.push(["  Cache created", fmtNum(u.cache_creation)]);
    rows.push(["  Thinking",      fmtNum(u.thinking_tokens)]);
    rows.push(["  This action",   fmtNum(n.turnTokens)]);
    rows.push(["", ""]);
    rows.push(["  Cache read",    fmtNum(u.cache_read) + " (reused context)"]);
    rows.push(["  Turn total",    fmtNum(n.turnFullTokens)]);
  }
  renderStatGrid(rows);
  if (e.prompt) {
    const d = document.getElementById("detail");
    const wrap = document.createElement("div");
    wrap.style.marginTop = "12px";
    wrap.innerHTML = '<div class="k" style="margin-bottom:6px">Prompt</div><div class="prompt-full"></div>';
    wrap.querySelector(".prompt-full").textContent = e.prompt;
    d.appendChild(wrap);
  }
}

async function quitServer() {
  if (!confirm("Stop the Claude Usage Monitor server?")) return;
  try { await fetch("/quit", { method: "POST" }); } catch (e) { }
  document.body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted);font-size:14px">Server stopped. You can close this tab.</div>';
}

function initResizers() {
  const wrap = document.getElementById("wrap");
  try {
    const sw = localStorage.getItem("cm-sw");
    const rw = localStorage.getItem("cm-rw");
    if (sw) wrap.style.setProperty("--sw", sw);
    if (rw) wrap.style.setProperty("--rw", rw);
  } catch (e) {}

  setupResizer("divL", "sidebar", "--sw", "cm-sw", (startW, dx) => startW + dx);
  setupResizer("divR", "side",    "--rw", "cm-rw", (startW, dx) => startW - dx);
}

function setupResizer(divId, panelId, cssVar, storageKey, compute) {
  const div = document.getElementById(divId);
  const wrap = document.getElementById("wrap");
  let startX = 0, startW = 0, dragging = false;

  div.addEventListener("mousedown", (e) => {
    startX = e.clientX;
    startW = document.getElementById(panelId).getBoundingClientRect().width;
    dragging = true;
    div.classList.add("dragging");
    document.body.classList.add("resizing");
    e.preventDefault();
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const next = Math.max(180, Math.min(700, compute(startW, dx)));
    wrap.style.setProperty(cssVar, next + "px");
  });
  document.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    div.classList.remove("dragging");
    document.body.classList.remove("resizing");
    try { localStorage.setItem(storageKey, wrap.style.getPropertyValue(cssVar)); } catch (e) {}
  });
}

initResizers();
tick();
