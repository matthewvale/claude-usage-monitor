<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Usage Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111419;          /* grey (specified) */
    --panel: #1a1e26;       /* one step lighter for cards */
    --panel2: #0d1015;      /* one step darker for sidebar */
    --edge: #2a2f39;
    --text: #ffffff;
    --muted: #a0a0a0;
    --accent: #2BA5E2;      /* blue (specified) */
    --accent-hi: #5fc5ec;   /* brighter blue for hover */
    --root: #E666FF;        /* pink (specified) - user prompts */
    --root-hi: #f091ff;     /* brighter pink for hover */
    --root-lo: #c951dc;     /* darker pink for pressed/hover */
    --tool: #2BA5E2;        /* blue */
    --tool-done: #E666FF;   /* pink - completed */
    --stop: #E666FF;        /* pink */
    --danger: #e63946;      /* red - kept for Quit button */
    --bad: #E7442A;         /* red - things to improve / needs attention */
    --bad-dim: rgba(231, 68, 42, 0.12);
    --good: #3ddc84;        /* green - healthy/positive usage signals */
    --good-dim: rgba(61, 220, 132, 0.12);
    --hover: #1e2129;       /* subtle row hover */
    --font: 'Fira Code', Consolas, 'Courier New', monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 var(--font); }
  body { display: flex; flex-direction: column; }
  header { border-bottom: 1px solid var(--edge); flex-shrink: 0; }
  .header-title-row { padding: 14px 18px 10px; display: flex; align-items: center;
                       justify-content: space-between; gap: 16px; }
  .header-credit { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .header-credit b { color: var(--text); font-weight: 600; }
  .header-controls-row { padding: 10px 18px 12px; border-top: 1px solid var(--edge);
                          display: flex; align-items: center; gap: 16px; }
  .title-block { display: flex; flex-direction: column; gap: 2px; }
  .title-sub { font-size: 11px; color: var(--muted); font-weight: 400;
               letter-spacing: .01em; margin-left: 30px; }

  /* Top tabs */
  nav.tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 14px; cursor: pointer; color: var(--muted); font-size: 13px;
         border-radius: 6px; font-weight: 700; user-select: none; }
  .tab:hover { color: var(--text); background: var(--hover); }
  .tab.active { color: #fff; background: var(--accent); }

  /* Per-prompt decision effort indicator */
  .prompt-effort { display: flex; flex-direction: column; align-items: flex-end;
                   gap: 3px; flex-shrink: 0; }
  .prompt-effort .pe-line { display: flex; align-items: baseline; gap: 5px; }
  .prompt-effort .pe-num { font-weight: 700; color: var(--text); font-size: 14px;
                           line-height: 1; }
  .prompt-effort .pe-lab { font-size: 10px; text-transform: uppercase;
                           letter-spacing: .08em; color: var(--muted); }
  .prompt-effort .pe-bar { width: 64px; height: 3px; background: var(--hover);
                           border-radius: 2px; overflow: hidden; }
  .prompt-effort .pe-bar > div { height: 100%; border-radius: 2px;
                                 transition: width 240ms, background 240ms; }

  /* Page containers */
  .page { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .page.hidden { display: none; }
  header h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: .5px;
              display: flex; align-items: center; gap: 8px; }
  .logo-mark { color: var(--root); width: 22px; height: 22px; display: inline-block;
               flex-shrink: 0; }
  header .stats { color: var(--muted); font-size: 13px; }
  select, button { background: var(--panel); color: var(--text); border: 1px solid var(--edge);
           border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 700; }
  button.danger:hover { background: #c92e3c; border-color: #c92e3c; }

  /* Themed scrollbars */
  * { scrollbar-color: var(--accent) var(--panel2); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--panel2); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px;
                              border: 3px solid var(--panel2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-hi); }
  ::-webkit-scrollbar-corner { background: var(--panel2); }

  #wrap { display: grid;
          grid-template-columns: var(--sw, 280px) 5px 1fr 5px var(--rw, 320px);
          flex: 1; min-height: 0; }

  /* Resizer handles between panels */
  .divider { background: var(--edge); cursor: col-resize; transition: background 120ms; }
  .divider:hover, .divider.dragging { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing iframe, body.resizing * { pointer-events: none; }

  /* Left sidebar - session list */
  #sidebar { border-right: 1px solid var(--edge); background: var(--panel2);
             display: flex; flex-direction: column; overflow: hidden; }
  #sidebar h2 { font-size: 11px; margin: 0; padding: 16px 14px 8px; color: var(--muted);
                text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
  #sess-list { flex: 1; overflow: auto; padding: 8px 8px 8px; }
  .proj-header { cursor: pointer; user-select: none; }
  .proj-header:hover { color: var(--text); }
  .proj-header .proj-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .proj-header .proj-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-header .proj-chevron { display: inline-block; transition: transform 120ms;
                                font-size: 9px; color: var(--muted); flex-shrink: 0; }
  .proj-header.collapsed .proj-chevron { transform: rotate(-90deg); }
  .proj-header { color: var(--muted); font-size: 10px; text-transform: uppercase;
                 letter-spacing: .1em; padding: 12px 10px 4px; font-weight: 700;
                 border-top: 1px solid var(--edge); margin-top: 8px;
                 display: flex; justify-content: space-between; align-items: center; }
  .proj-header:first-child { border-top: 0; margin-top: 0; }
  .proj-header .count { color: var(--muted); opacity: .8; font-weight: 400; }
  .sidebar-foot { padding: 12px; text-align: center; color: var(--muted);
                  font-size: 11px; border-top: 1px solid var(--edge);
                  background: var(--panel2); }

  .sess-item { padding: 10px 12px; border-radius: 6px; cursor: pointer;
               margin-bottom: 4px; border: 1px solid transparent; }
  .sess-item:hover { background: var(--hover); }
  .sess-item.active { background: #142633; border-color: var(--accent); }
  .all-item-area { padding-bottom: 10px; margin-bottom: 8px;
                   border-bottom: 1px solid var(--edge); }
  .sess-item.all-item { background: rgba(43, 165, 226, 0.05);
                        border-color: rgba(43, 165, 226, 0.1); color: var(--text);
                        margin-bottom: 0; }
  .sess-item.all-item .sess-meta span,
  .sess-item.all-item .sess-meta span::before { color: var(--muted); }
  .sess-item.all-item:hover { background: rgba(43, 165, 226, 0.12);
                              border-color: rgba(43, 165, 226, 0.25); }
  .sess-item.all-item.active { background: rgba(43, 165, 226, 0.2);
                               border-color: var(--accent);
                               box-shadow: 0 0 0 2px rgba(43, 165, 226, 0.25); }
  .sess-title { font-weight: 700; font-size: 13px; margin-bottom: 4px;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; line-height: 1.3; }
  .sess-meta { color: var(--muted); font-size: 11px; display: flex; gap: 8px;
               flex-wrap: wrap; }
  .sess-meta span::before { content: "• "; margin-right: 2px; }
  .sess-meta span:first-child::before { content: ""; margin-right: 0; }
  .sess-meta span.meta-model  { color: var(--accent); font-weight: 700; }
  .sess-meta span.meta-actions { color: var(--root-lo); font-weight: 700; }
  .sess-meta span.meta-tokens  { color: var(--root); font-weight: 700; }

  /* Canvas */
  #canvas-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #canvas-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 24px;
                    border-bottom: 1px solid var(--edge); flex-shrink: 0; }
  #canvas-toolbar label { color: var(--muted); font-size: 12px; }
  #canvas { overflow: auto; padding: 24px; flex: 1; min-height: 0; }
  .session { margin-bottom: 40px; }
  .session-title { font-size: 14px; color: var(--text); margin-bottom: 6px;
                   font-weight: 700; }
  .session-stats { font-size: 11px; color: var(--muted); margin-bottom: 14px; }

  /* Collapsible prompt group */
  .prompt-group { border: 1px solid var(--edge); border-radius: 8px;
                  margin-bottom: 8px; background: var(--panel); overflow: hidden; }
  .prompt-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
                 cursor: pointer; transition: background 120ms; }
  .prompt-head:hover { background: var(--hover); }
  .prompt-group.expanded .prompt-head { background: var(--hover); border-bottom: 1px solid var(--edge); }
  .prompt-dot { width: 12px; height: 12px; border-radius: 50%;
                background: var(--root); flex-shrink: 0;
                box-shadow: 0 0 8px rgba(230, 102, 255, 0.5); }
  .prompt-text { flex: 1; font-weight: 700; font-size: 13px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prompt-count { color: var(--muted); font-size: 12px; flex-shrink: 0; }

  /* Model chip */
  .model-chip { display: inline-flex; align-items: center; gap: 4px;
                background: rgba(43, 165, 226, 0.12); color: var(--accent);
                border: 1px solid rgba(43, 165, 226, 0.35);
                border-radius: 10px; padding: 1px 8px; font-size: 10px;
                font-weight: 700; letter-spacing: .02em; flex-shrink: 0;
                white-space: nowrap; }
  .model-chip.mixed { background: rgba(230, 102, 255, 0.12); color: var(--root);
                      border-color: rgba(230, 102, 255, 0.35); }
  .model-chip .plus { opacity: .8; margin-left: 2px; font-weight: 400; }

  /* Reasoning effort chip */
  .reasoning-chip { display: inline-flex; align-items: center; gap: 4px;
                     border-radius: 10px; padding: 1px 8px; font-size: 10px;
                     font-weight: 700; letter-spacing: .02em; flex-shrink: 0;
                     white-space: nowrap; }
  .reasoning-chip .plus { opacity: .8; margin-left: 2px; font-weight: 400; }
  .reasoning-chip.reasoning-low    { background: rgba(43,165,226,0.12); color: var(--accent); border: 1px solid rgba(43,165,226,0.35); }
  .reasoning-chip.reasoning-medium { background: rgba(240,160,32,0.12); color: #f0a020; border: 1px solid rgba(240,160,32,0.35); }
  .reasoning-chip.reasoning-high   { background: rgba(230,102,255,0.12); color: var(--root); border: 1px solid rgba(230,102,255,0.35); }

  /* Token chip */
  .token-chip { display: inline-flex; align-items: center;
                background: var(--hover); color: var(--muted);
                border: 1px solid var(--edge);
                border-radius: 10px; padding: 1px 8px; font-size: 10px;
                font-weight: 700; letter-spacing: .02em; flex-shrink: 0;
                white-space: nowrap; }
  .suggestion-flag { display: inline-flex; align-items: center; justify-content: center;
                      width: 20px; height: 20px; border-radius: 50%; font-size: 11px;
                      font-weight: 700; flex-shrink: 0; }
  .suggestion-flag.flag-good { background: var(--good-dim); color: var(--good); }
  .suggestion-flag.flag-bad  { background: var(--bad-dim);  color: var(--bad); }
  .chevron { color: var(--muted); font-size: 16px; transition: transform 120ms;
             flex-shrink: 0; width: 14px; text-align: center; }
  .prompt-group.expanded .chevron { transform: rotate(90deg); color: var(--accent); }
  .prompt-body { padding: 14px 18px 18px 40px; }
  .prompt-full, .prompt-response { background: var(--panel2); border: 1px solid var(--edge);
                                    border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .pf-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
              color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .pf-label-row { display: flex; align-items: center; justify-content: space-between;
                  margin-bottom: 6px; }
  .pf-label-row .pf-label { margin-bottom: 0; }
  .pf-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
             color: var(--text); max-height: 260px; overflow: auto; }
  .prompt-full .pf-text { color: var(--text); }
  .prompt-tip { border-radius: 8px; padding: 12px 14px; margin-bottom: 0; border: 1px solid; }
  .prompt-tip .pf-label { margin-bottom: 4px; }
  .prompt-tip .tip-text { font-size: 12px; line-height: 1.5; color: var(--text); }
  .prompt-tip.tip-bad  { background: var(--bad-dim);  border-color: rgba(231,68,42,0.3);  border-left: 3px solid var(--bad); }
  .prompt-tip.tip-bad  .pf-label { color: var(--bad); }
  .prompt-tip.tip-good { background: var(--good-dim); border-color: rgba(61,220,132,0.3); border-left: 3px solid var(--good); }
  .prompt-tip.tip-good .pf-label { color: var(--good); }
  .pf-tok { font-size: 10px; font-weight: 700; color: var(--muted);
            background: var(--hover); border: 1px solid var(--edge);
            border-radius: 10px; padding: 2px 8px; }

  /* Per-prompt token breakdown */
  .token-breakdown { background: var(--panel2); border: 1px solid var(--edge);
                      border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .tb-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden;
            background: var(--hover); margin-bottom: 10px; }
  .tb-seg { height: 100%; }
  .tb-seg.tb-input        { background: var(--accent); }
  .tb-seg.tb-cacheread    { background: var(--accent-hi); }
  .tb-seg.tb-cachecreate  { background: var(--muted); opacity: .6; }
  .tb-seg.tb-output       { background: var(--root); }
  .tb-seg.tb-thinking     { background: var(--root-hi); }
  .tb-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; }
  .tb-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px;
                     color: var(--muted); }
  .tb-legend-item .tb-val { color: var(--text); font-weight: 700; }
  .tb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tb-dot.tb-input        { background: var(--accent); }
  .tb-dot.tb-cacheread    { background: var(--accent-hi); }
  .tb-dot.tb-cachecreate  { background: var(--muted); }
  .tb-dot.tb-output       { background: var(--root); }
  .tb-dot.tb-thinking     { background: var(--root-hi); }

  /* Tool timeline inside expanded prompts */
  .tl-wrap { overflow-x: auto; max-width: 100%; }
  .tool-timeline { display: block; }
  .tl-axis { stroke: var(--edge); stroke-width: 2; stroke-linecap: round; }
  .tl-connector { fill: none; stroke: var(--edge); stroke-width: 1.5; }
  .tl-node { cursor: pointer; }
  .tl-node circle { stroke: var(--bg); stroke-width: 2.5; transition: r 120ms; }
  .tl-node:hover circle { stroke: #fff; }
  .tl-node.selected circle { stroke: #fff; stroke-width: 3; }
  .tl-node text.name { fill: var(--text); font-size: 11px; font-weight: 700;
                       font-family: var(--font); }
  .tl-node text.step { fill: var(--muted); font-size: 9px; font-weight: 700; }
  .tl-node.cat-files    circle { fill: var(--accent); }
  .tl-node.cat-shell    circle { fill: var(--root); }
  .tl-node.cat-search   circle { fill: var(--accent-hi); }
  .tl-node.cat-web      circle { fill: var(--root-hi); }
  .tl-node.cat-task     circle { fill: #ffffff; }
  .tl-node.cat-browser  circle { fill: #7d8a99; }
  .tl-node.cat-mcp      circle { fill: var(--accent-hi); }
  .tl-node.cat-other    circle { fill: var(--muted); }
  .tl-node.pending circle { fill-opacity: 0.4; stroke-dasharray: 3 2; }
  @keyframes tlpop { from { r: 0; } to { r: 9; } }
  .tl-node.new circle { animation: tlpop 400ms ease-out; }

  /* Category pie + legend under the axis, centered */
  .tl-legend-wrap { display: flex; align-items: center; justify-content: center;
                     gap: 22px; margin: 14px 0 20px; flex-wrap: wrap; }
  .tl-pie { width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0;
            box-shadow: 0 0 0 1px var(--edge) inset; }
  .tl-legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
               font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .tl-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
  .tl-legend .lg .swatch { width: 8px; height: 8px; border-radius: 50%; }
  .tl-legend .lg .lg-pct { font-weight: 700; }

  /* Detail panel */
  #side { border-left: 1px solid var(--edge); background: var(--panel);
          padding: 16px; overflow: auto; }
  #side h2 { font-size: 11px; margin: 0 0 10px 0; color: var(--muted);
             text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
  #side pre { background: var(--panel2); padding: 10px; border-radius: 6px;
              white-space: pre-wrap; word-break: break-word; color: var(--text);
              font-family: Consolas, 'Courier New', monospace; font-size: 12px;
              border: 1px solid var(--edge); }
  .stat-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px;
               margin-bottom: 16px; }
  .stat-grid .k { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .stat-grid .v { font-weight: 700; font-size: 13px; text-align: right;
                  white-space: normal; overflow-wrap: break-word; word-break: break-word; }

  /* Summary page - analytics dashboard */
  #summary-content { padding: 30px 40px 50px; overflow: auto; height: 100%; box-sizing: border-box; }
  .sum-shell { max-width: 1180px; margin: 0 auto; }
  .sum-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:22px; }
  .sum-title { font-size: 24px; margin: 0 0 4px; font-weight: 700; letter-spacing:.2px; }
  .sum-sub { color: var(--muted); font-size: 13px; }
  .sum-scope { color: var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
  .sum-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .sum-card { background: linear-gradient(145deg, rgba(255,255,255,.025), rgba(255,255,255,0)); border: 1px solid var(--edge);
              border-radius: 12px; padding: 20px 22px; box-shadow: 0 8px 28px rgba(0,0,0,.12); min-width:0; }
  .sum-card.span-12 { grid-column: span 12; }
  .sum-card.span-8 { grid-column: span 8; }
  .sum-card.span-6 { grid-column: span 6; }
  .sum-card.span-4 { grid-column: span 4; }
  .sum-card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 15px; font-weight: 700; }
  .sum-card h3 strong { color:var(--text); font-size:14px; letter-spacing:0; text-transform:none; }
  .sum-bigs { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .sum-big { padding:14px 0; border-right:1px solid var(--edge); }
  .sum-big:last-child { border-right:0; }
  .sum-big .n { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.05; }
  .sum-big .n.accent { color: var(--accent); }
  .sum-big .n.pink { color: var(--root); }
  .sum-big .l { color: var(--muted); font-size: 11px; margin-top:5px; text-transform:uppercase; letter-spacing:.07em; }
  .sum-big .delta { color:var(--muted); font-size:10px; margin-top:4px; }
  .usage-limits { display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
                  margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--edge); }
  .usage-limit-head { display: flex; justify-content: space-between; align-items: baseline;
                       margin-bottom: 6px; }
  .usage-limit-label { font-size: 12px; font-weight: 700; color: var(--text); }
  .usage-limit-pct { font-size: 12px; font-weight: 700; color: var(--accent); }
  .usage-limit-pct.warn   { color: #f0a020; }
  .usage-limit-pct.danger { color: var(--bad); }
  .usage-limit-bar { height: 8px; background: var(--hover); border-radius: 4px; overflow: hidden; }
  .usage-limit-bar > div { height: 100%; background: var(--accent); border-radius: 4px;
                            transition: width 300ms; }
  .usage-limit-bar > div.warn   { background: #f0a020; }
  .usage-limit-bar > div.danger { background: var(--bad); }
  .usage-limit-hint { color: var(--muted); font-size: 10px; margin-top: 5px; }
  @media (max-width: 700px) { .usage-limits { grid-template-columns: 1fr; } }
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; gap:12px; padding: 8px 0; border-bottom: 1px dashed var(--edge); font-size: 13px; }
  .sum-row:last-child { border-bottom: 0; }
  .sum-row .k { color: var(--muted); }
  .sum-row .v { font-weight: 700; text-align:right; }
  .sum-row.total { border-top: 2px solid var(--edge); padding-top: 12px; margin-top: 4px; font-size: 15px; border-bottom: 0; }
  .sum-row.total .v { color: var(--accent); font-size: 16px; }
  .bar-row { margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row .lab { display: flex; justify-content: space-between; gap:12px; font-size: 12px; margin-bottom: 5px; }
  .bar-row .lab .k { color: var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .lab .v { color: var(--text); font-weight: 700; white-space:nowrap; }
  .bar { height: 7px; background: var(--hover); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar > div.pink { background: var(--root); }
  .bar > div.red { background: var(--root); }
  .bar > div.amber { background: #f0a020; }
  .insight { border-left:3px solid var(--accent); background:rgba(43,165,226,.055); border-radius:8px; padding:13px 14px; margin-top:14px; }
  .insight .eyebrow { color:var(--accent); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin-bottom:4px; }
  .insight .headline { font-size:15px; font-weight:700; margin-bottom:4px; }
  .insight .copy { color:var(--muted); font-size:12px; line-height:1.5; }
  .insight.good     { border-left-color: var(--good); background: var(--good-dim); }
  .insight.good     .eyebrow { color: var(--good); }
  .score-wrap { display:flex; align-items:center; gap:20px; }
  .score-ring { width:184px; height:184px; border-radius:50%; display:grid; place-items:center; position:relative; flex:0 0 auto; background:conic-gradient(var(--ring-color, var(--accent)) var(--score), var(--edge) 0); }
  .score-ring::before { content:""; width:144px; height:144px; border-radius:50%; background:var(--panel); position:absolute; }
  .score-ring .score { position:relative; font-size:38px; font-weight:700; white-space:nowrap; }
  .score-copy { flex:1; min-width:0; }
  .score-label { font-size:14px; font-weight:700; margin-bottom:5px; }
  .score-label.good { color: var(--good); }
  .score-note { color:var(--muted); font-size:12px; line-height:1.5; }
  .checklist { margin-top:12px; display:grid; gap:11px; }
  .check { display:flex; gap:8px; align-items:flex-start; font-size:11px; color:var(--muted); }
  .check b { color:var(--text); }
  .check i { display:block; font-style:normal; color:var(--muted); font-size:10.5px;
             margin-top:2px; opacity:.85; }
  .check.warn i { color:var(--bad); opacity:1; }
  .check i .rec { color: var(--accent); font-weight: 600; }
  .check .dot { width:7px; height:7px; border-radius:50%; margin-top:5px; background:var(--good); flex:0 0 auto; }
  .check.warn .dot { background:var(--bad); }
  .eff-top { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .eff-top .score-wrap { flex: 0 0 auto; width: 260px; flex-direction: column;
                          align-items: center; text-align: center; gap: 14px; }
  .eff-top .checklist { flex: 1; min-width: 200px; margin-top: 6px; }
  .eff-divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 4px;
                 padding-top: 16px; border-top: 1px solid var(--edge); }
  .eff-divider .eyebrow { color: var(--bad); font-size: 11px; font-weight: 700;
                           text-transform: uppercase; letter-spacing: .1em; }
  .opportunity { display:grid; grid-template-columns:24px 1fr auto; gap:10px; align-items:start; padding:12px 0; border-bottom:1px solid var(--edge); }
  .opportunity:last-child { border-bottom:0; padding-bottom:0; }
  .insight-tally { display:grid; grid-template-columns:26px 1fr auto; gap:12px; align-items:start;
                    padding:11px 0; border-bottom:1px solid var(--edge); }
  .insight-tally .tally-badge { margin-top:2px; }
  .insight-tally:last-child { border-bottom:0; padding-bottom:0; }
  .tally-badge { width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
                 font-weight:700; font-size:11px; }
  .tally-badge.bad  { background:var(--bad-dim);  color:var(--bad); }
  .tally-badge.good { background:var(--good-dim); color:var(--good); }
  .tally-body { min-width:0; }
  .tally-label { font-size:13px; font-weight:700; }
  .tally-sample { color:var(--muted); font-size:11px; margin-top:2px;
                  white-space:normal; overflow-wrap:break-word; word-break:break-word; }
  .tally-count { font-size:15px; font-weight:700; white-space:nowrap; }
  .tally-count.bad  { color:var(--bad); }
  .tally-count.good { color:var(--good); }
  .tip-card { display: flex; gap: 14px; align-items: flex-start;
              background: rgba(43,165,226,0.06); border-color: rgba(43,165,226,0.25); }
  .tip-card-icon { font-size: 22px; line-height: 1; flex-shrink: 0; }
  .opp-icon { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; background:var(--bad-dim); color:var(--bad); font-weight:700; }
  .opp-icon.good { background: var(--good-dim); color: var(--good); }
  .opp-title { font-size:13px; font-weight:700; }
  .opp-copy { color:var(--muted); font-size:11px; line-height:1.45; margin-top:2px; }
  .opp-action { color: var(--accent); font-size: 11px; line-height: 1.45; margin-top: 6px;
                font-weight: 600; background: rgba(43,165,226,0.08);
                border-left: 2px solid var(--accent); padding: 4px 8px; border-radius: 4px; }
  .opp-impact { font-size:10px; font-weight:700; white-space:nowrap; }
  .opp-impact.impact-high   { color: var(--bad); }
  .opp-impact.impact-medium { color: #f0a020; }
  .opp-impact.impact-low    { color: var(--accent); }
  .opp-impact.impact-good   { color: var(--good); }
  .activity-chart { display:grid; grid-template-columns:repeat(auto-fit, minmax(70px, 1fr)); gap:8px; align-items:end; height:150px; padding-top:10px; }
  .activity-col { height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:7px; min-width:0; }
  .activity-val { font-size:10px; color:var(--muted); }
  .activity-bar { width:100%; max-width:72px; min-height:5px; background:linear-gradient(to top,var(--accent),var(--root)); border-radius:5px 5px 2px 2px; box-shadow:0 0 18px rgba(43,165,226,.12); }
  .activity-name { font-size:10px; color:var(--muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; }
  .project-row { display:grid; grid-template-columns:150px 1fr 70px; gap:12px; align-items:center; margin:10px 0; }
  .project-name { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .project-pct { color:var(--muted); font-size:11px; text-align:right; }
  .sum-empty { color: var(--muted); font-size: 13px; padding:24px; background:var(--panel); border:1px solid var(--edge); border-radius:12px; }

  /* Worst offending prompts */
  .offender-row { display: flex; align-items: center; gap: 12px; padding: 10px 0;
                  border-bottom: 1px solid var(--edge); cursor: pointer; }
  .offender-row:last-child { border-bottom: 0; }
  .offender-row:hover .offender-prompt { color: var(--accent); }
  .offender-rank { width: 24px; flex-shrink: 0; text-align: center; font-weight: 700;
                    color: var(--muted); font-size: 12px; }
  .offender-body { flex: 1; min-width: 0; }
  .offender-prompt { font-size: 13px; font-weight: 700; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; }
  .offender-meta { color: var(--muted); font-size: 11px; margin-top: 2px;
                    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .offender-tok { color: var(--bad); font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .offender-flag { background: var(--bad-dim); color: var(--bad); font-size: 10px;
                    font-weight: 700; border-radius: 10px; padding: 1px 8px; }
  @media (max-width: 900px) { .sum-card.span-8,.sum-card.span-6,.sum-card.span-4 { grid-column:span 12; } .sum-bigs{grid-template-columns:repeat(2,1fr)} .sum-big{border-right:0} }
</style>
</head>
<body>
<header>
  <div class="header-title-row">
    <div class="title-block">
      <h1><svg class="logo-mark" viewBox="-50 -50 100 100" aria-hidden="true"><g fill="currentColor"><ellipse cx="0" cy="-30" rx="6" ry="18"/><ellipse cx="0" cy="30" rx="6" ry="18"/><ellipse cx="-30" cy="0" rx="18" ry="6"/><ellipse cx="30" cy="0" rx="18" ry="6"/><g transform="rotate(45)"><ellipse cx="0" cy="-22" rx="4" ry="10"/><ellipse cx="0" cy="22" rx="4" ry="10"/><ellipse cx="-22" cy="0" rx="10" ry="4"/><ellipse cx="22" cy="0" rx="10" ry="4"/></g></g></svg>Claude Usage Monitor</h1>
      <div class="title-sub">Live analytics of your Claude usage. Optimise today.</div>
    </div>
    <div class="header-credit">Created by <b>Matt Vale</b></div>
  </div>
  <div class="header-controls-row">
    <nav class="tabs">
      <div class="tab active" id="tab-summary" onclick="showPage('summary')">Summary</div>
      <div class="tab" id="tab-conv" onclick="showPage('conv')">Conversations</div>
    </nav>
    <button class="danger" onclick="quitServer()">Quit</button>
    <span style="flex:1"></span>
    <label style="color:var(--muted);font-size:12px">Source
      <select id="source" onchange="applyFilters()">
        <option value="all">All</option>
        <option value="desktop">Desktop app</option>
        <option value="cli">Terminal CLI</option>
      </select>
    </label>
    <label style="color:var(--muted);font-size:12px">Project
      <select id="project" onchange="applyFilters()">
        <option value="all">All projects</option>
      </select>
    </label>
    <label style="color:var(--muted);font-size:12px">Sort
      <select id="sort" onchange="applyFilters()">
        <option value="latest" selected>Latest</option>
        <option value="tokens">Most tokens</option>
        <option value="duration">Longest</option>
      </select>
    </label>
    <label style="color:var(--muted);font-size:12px">Show
      <select id="hours" onchange="hoursChanged()">
        <option value="today" selected>Today</option>
        <option value="1">Last 1 hour</option>
        <option value="6">Last 6 hours</option>
        <option value="24">Last 24 hours</option>
        <option value="168">Last 7 days</option>
        <option value="0">All history</option>
      </select>
    </label>
  </div>
</header>
<div id="page-conv" class="page hidden">
<div id="wrap">
  <nav id="sidebar">
    <h2>Conversations</h2>
    <div id="sess-list"></div>
  </nav>
  <div class="divider" id="divL"></div>
  <div id="canvas-col">
    <div id="canvas-toolbar">
      <label for="canvasSort">Sort</label>
      <select id="canvasSort" onchange="renderCanvas(0)">
        <option value="latest" selected>Latest</option>
        <option value="tokens">Most tokens</option>
        <option value="duration">Longest</option>
      </select>
    </div>
    <div id="canvas"></div>
  </div>
  <div class="divider" id="divR"></div>
  <aside id="side">
    <h2>Details</h2>
    <div id="detail"><em style="color:var(--muted)">Click a session on the left, or a node in the tree.</em></div>
  </aside>
</div>
</div><!-- /page-conv -->

<div id="page-summary" class="page">
  <div id="summary-content"></div>
</div>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
let lastCount = 0;
let selectedNodeId = null;
let selectedSessionId = null;   // null = show all
let cachedEvents = [];
let sessionsSorted = [];         // [[sid, evs, summary], ...]
let expandedPrompts = new Set(); // ids of expanded prompt groups
let collapsedProjects = new Set(); // project names collapsed in the sidebar
let currentPage = "summary";

function showPage(name) {
  currentPage = name;
  document.getElementById("page-conv").classList.toggle("hidden", name !== "conv");
  document.getElementById("page-summary").classList.toggle("hidden", name !== "summary");
  document.getElementById("tab-conv").classList.toggle("active", name === "conv");
  document.getElementById("tab-summary").classList.toggle("active", name === "summary");
  if (name === "summary") renderSummary();
}

function classifySource(ep) {
  if (!ep) return "cli";
  const s = String(ep).toLowerCase();
  if (s.indexOf("desktop") >= 0) return "desktop";
  return "cli";
}

function categoryFor(name) {
  if (!name) return "other";
  const n = String(name);
  if (/^(Read|Write|Edit|MultiEdit|NotebookEdit)$/.test(n)) return "files";
  if (/^(Bash|PowerShell)$/.test(n)) return "shell";
  if (/^(Grep|Glob)$/.test(n)) return "search";
  if (/^(WebFetch|WebSearch|Artifact)$/.test(n)) return "web";
  if (/^(Task|TaskCreate|TaskUpdate|TodoWrite|Agent|Skill|SuggestSkills|SuggestPluginInstall|ToolSearch|ExitPlanMode|EnterPlanMode)$/.test(n)) return "task";
  if (/^mcp__(Claude_Browser|claude-in-chrome)/.test(n)) return "browser";
  if (/^mcp__/.test(n)) return "mcp";
  return "other";
}

const CATEGORY_LABELS = {
  files: "Files", shell: "Shell", search: "Search", web: "Web",
  task: "Task", browser: "Browser", mcp: "MCP", other: "Other"
};

function buildToolTimeline(tools) {
  if (!tools.length) return null;

  const nodeR   = 9;
  const spacing = Math.min(140, Math.max(74, 900 / tools.length));
  const padX    = 24;
  const yAxis   = 34;
  const width   = padX * 2 + spacing * tools.length;
  const height  = 76;

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("class", "tool-timeline");
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);

  const positions = tools.map((_, i) => padX + spacing * (i + 0.5));

  // Main axis line (only between first and last node)
  const axis = document.createElementNS(SVG_NS, "line");
  axis.setAttribute("x1", positions[0]);
  axis.setAttribute("y1", yAxis);
  axis.setAttribute("x2", positions[positions.length - 1]);
  axis.setAttribute("y2", yAxis);
  axis.setAttribute("class", "tl-axis");
  svg.appendChild(axis);

  // Nodes
  tools.forEach((t, i) => {
    const x = positions[i];
    const cat = categoryFor(t.event.tool_name);
    const g = document.createElementNS(SVG_NS, "g");
    let cls = "tl-node cat-" + cat;
    if (!t.done) cls += " pending";
    if (t.isNew) cls += " new";
    if (selectedNodeId === t.id) cls += " selected";
    g.setAttribute("class", cls);
    g.setAttribute("transform", "translate(" + x + ", " + yAxis + ")");

    const step = document.createElementNS(SVG_NS, "text");
    step.setAttribute("class", "step");
    step.setAttribute("y", -14);
    step.setAttribute("text-anchor", "middle");
    step.textContent = (i + 1);
    g.appendChild(step);

    const circle = document.createElementNS(SVG_NS, "circle");
    circle.setAttribute("r", nodeR);
    g.appendChild(circle);

    const label = document.createElementNS(SVG_NS, "text");
    label.setAttribute("class", "name");
    label.setAttribute("y", nodeR + 16);
    label.setAttribute("text-anchor", "middle");
    label.textContent = t.label;
    g.appendChild(label);

    const title = document.createElementNS(SVG_NS, "title");
    title.textContent = t.label + " · " + (t.done ? "done" : "in progress");
    g.appendChild(title);

    g.onclick = (ev) => {
      ev.stopPropagation();
      selectedNodeId = t.id;
      showDetail(t);
      renderCanvas(0);
    };
    svg.appendChild(g);
  });

  return svg;
}

function catColor(cat) {
  const cssVar = catCssVar(cat);
  const val = cssVar && getComputedStyle(document.documentElement).getPropertyValue(cssVar);
  return (val && val.trim()) || catFallbackColor(cat);
}

function buildTimelineLegend(tools) {
  const counts = {};
  for (const t of tools) {
    const cat = categoryFor(t.event.tool_name);
    counts[cat] = (counts[cat] || 0) + 1;
  }
  const usedCats = Object.keys(counts);
  if (usedCats.length < 2) return null;
  const total = tools.length;
  const ordered = ["files", "shell", "search", "web", "task", "browser", "mcp", "other"].filter(c => counts[c]);

  // Build a conic-gradient pie from each category's share.
  let acc = 0;
  const stops = [];
  const colors = {};
  for (const cat of ordered) {
    const color = catColor(cat);
    colors[cat] = color;
    const share = (counts[cat] / total) * 100;
    stops.push(color + " " + acc.toFixed(2) + "% " + (acc + share).toFixed(2) + "%");
    acc += share;
  }

  const wrap = document.createElement("div");
  wrap.className = "tl-legend-wrap";

  const pie = document.createElement("div");
  pie.className = "tl-pie";
  pie.style.background = "conic-gradient(" + stops.join(", ") + ")";
  wrap.appendChild(pie);

  const legend = document.createElement("div");
  legend.className = "tl-legend";
  for (const cat of ordered) {
    const pct = Math.round((counts[cat] / total) * 100);
    const item = document.createElement("div");
    item.className = "lg";
    item.innerHTML = '<span class="swatch"></span><span class="lg-label"></span><span class="lg-pct"></span>';
    item.querySelector(".swatch").style.background = colors[cat];
    item.querySelector(".lg-label").textContent = CATEGORY_LABELS[cat];
    item.querySelector(".lg-label").style.color = colors[cat];
    item.querySelector(".lg-pct").style.color = colors[cat];
    item.querySelector(".lg-pct").textContent = pct + "%";
    legend.appendChild(item);
  }
  wrap.appendChild(legend);

  return wrap;
}

function catCssVar(cat) {
  switch (cat) {
    case "files":   return "--accent";
    case "shell":   return "--root";
    case "search":  return "--accent-hi";
    case "web":     return "--root-hi";
    case "mcp":     return "--accent-hi";
  }
  return "";
}
function catFallbackColor(cat) {
  return { task: "#ffffff", browser: "#7d8a99", other: "#a0a0a0" }[cat] || "#a0a0a0";
}

function prettyModel(m) {
  if (!m) return "?";
  const s = String(m).toLowerCase();
  const match = s.match(/claude-(opus|sonnet|haiku|fable)-(\d+)-?(\d+)?/);
  if (match) {
    const family = match[1].charAt(0).toUpperCase() + match[1].slice(1);
    const major  = match[2];
    const minor  = match[3];
    return family + " " + major + (minor ? "." + minor : "");
  }
  return m;
}

function projectFromCwd(cwd) {
  if (!cwd) return "No folder";
  const s = String(cwd).replace(/\\/g, "/");
  if (s.indexOf("/scratch-workspaces/") >= 0) return "No folder";
  const parts = s.split("/").filter(Boolean);
  return parts[parts.length - 1] || "No folder";
}

function applyFilters() {
  // If the currently selected session no longer matches the active filters, unselect.
  const src  = document.getElementById("source").value;
  const proj = document.getElementById("project").value;
  if (selectedSessionId) {
    const found = sessionsSorted.find(([sid]) => sid === selectedSessionId);
    if (found) {
      const s = found[2];
      if ((src  !== "all" && s.source  !== src)  ||
          (proj !== "all" && s.project !== proj)) {
        selectedSessionId = null;
      }
    }
  }
  // Re-run the full render pipeline (re-sorts sessionsSorted with the current sort mode
  // and re-renders sidebar, canvas, detail AND summary in one go).
  if (cachedEvents && cachedEvents.length) render(cachedEvents, 0);
}

function sessionsAfterFilters() {
  const src  = document.getElementById("source").value;
  const proj = document.getElementById("project").value;
  return sessionsSorted.filter(([, , s]) =>
    (src  === "all" || s.source  === src) &&
    (proj === "all" || s.project === proj)
  );
}

function refreshProjectSelect() {
  const sel = document.getElementById("project");
  const counts = {};
  for (const [, , s] of sessionsSorted) counts[s.project] = (counts[s.project] || 0) + 1;
  const names = Object.keys(counts).sort((a, b) => {
    if (a === "No folder") return 1;
    if (b === "No folder") return -1;
    return a.localeCompare(b);
  });
  const prevValue = sel.value;
  const html = ['<option value="all">All projects (' + sessionsSorted.length + ')</option>'];
  for (const n of names) {
    html.push('<option value="' + escapeAttr(n) + '">' + escapeHtml(n) + ' (' + counts[n] + ')</option>');
  }
  sel.innerHTML = html.join("");
  if (prevValue && [...sel.options].some(o => o.value === prevValue)) sel.value = prevValue;
}

function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
function escapeAttr(s) { return String(s).replace(/["&<>]/g, c => ({ '"':"&quot;","&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }

async function refresh(force) {
  try {
    const raw = document.getElementById("hours").value;
    let hours;
    if (raw === "today") {
      const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
      hours = (Date.now() - midnight.getTime()) / 3600000;
    } else {
      hours = raw;
    }
    const r = await fetch("/events.json?hours=" + encodeURIComponent(hours), { cache: "no-store" });
    const events = await r.json();
    if (force || events.length !== lastCount) {
      const isNew = events.length > lastCount;
      cachedEvents = events;
      render(events, force ? 0 : (isNew ? lastCount : 0));
      lastCount = events.length;
    }
  } catch (e) { }
}

async function tick() {
  await refresh(false);
  setTimeout(tick, 800);
}

function hoursChanged() { lastCount = -1; refresh(true); }

function fmtNum(n) {
  if (n == null) return "-";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}

function fmtRel(ts) {
  const s = Math.max(0, (Date.now() / 1000) - ts);
  if (s < 60)      return Math.round(s) + "s ago";
  if (s < 3600)    return Math.round(s / 60) + "m ago";
  if (s < 86400)   return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function summarizeSession(evs) {
  let prompts = 0, tools = 0, turns = 0;
  let inTok = 0, outTok = 0, cacheCreate = 0, cacheRead = 0, thinking = 0;
  let firstPrompt = null, entrypoint = null, cwd = null, aiTitle = null;
  const modelCounts = new Map();
  const effortCounts = new Map();
  let lastModel = null;
  let firstTs = Infinity, lastTs = 0;
  for (const e of evs) {
    if (e.event === "SessionTitle") {
      if (!aiTitle && e.title) aiTitle = e.title;
      continue;   // no real timestamp on this row - exclude from first/last activity
    }
    if (e.ts < firstTs) firstTs = e.ts;
    if (e.ts > lastTs)  lastTs  = e.ts;
    if (e.event === "UserPromptSubmit") {
      prompts++;
      if (!firstPrompt) firstPrompt = e.prompt;
      if (!entrypoint && e.entrypoint) entrypoint = e.entrypoint;
      if (!cwd && e.cwd) cwd = e.cwd;
    }
    else if (e.event === "PreToolUse") { tools++; }
    else if (e.event === "AssistantTurn") {
      turns++;
      inTok += e.input_tokens || 0;
      outTok += e.output_tokens || 0;
      cacheCreate += e.cache_creation || 0;
      cacheRead += e.cache_read || 0;
      thinking += e.thinking_tokens || 0;
      if (e.model) {
        modelCounts.set(e.model, (modelCounts.get(e.model) || 0) + 1);
        lastModel = e.model;
      }
      if (e.effort) effortCounts.set(e.effort, (effortCounts.get(e.effort) || 0) + 1);
    }
  }
  const modelsSorted = Array.from(modelCounts.entries()).sort((a, b) => b[1] - a[1]);
  const primaryModel = modelsSorted.length ? modelsSorted[0][0] : null;
  const effortsSorted = Array.from(effortCounts.entries()).sort((a, b) => b[1] - a[1]);
  const primaryEffort = effortsSorted.length ? effortsSorted[0][0] : null;
  const title = aiTitle ? shorten(aiTitle, 70)
              : firstPrompt ? shorten(firstPrompt, 70)
              : "(no prompt)";
  return {
    title,
    firstTs: firstTs === Infinity ? 0 : firstTs,
    lastTs,
    prompts, tools, turns,
    inTok, outTok, cacheCreate, cacheRead, thinking,
    totalTokens: inTok + outTok + cacheCreate + cacheRead,
    // Cache reads are reused context, not new work. Used specifically where a
    // token figure sits next to an action count, so that number reflects what
    // was actually newly processed for that work rather than the growing
    // size of the context being carried along.
    freshTokens: inTok + outTok + cacheCreate + thinking,
    entrypoint,
    cwd,
    source: classifySource(entrypoint),
    project: projectFromCwd(cwd),
    modelsSorted,        // [[modelId, count], ...] most-used first
    primaryModel,
    lastModel,
    effortsSorted,       // [[level, count], ...] most-used first
    primaryEffort
  };
}

function render(events, newFromIndex) {
  const bySession = new Map();
  events.forEach((e, i) => {
    e._idx = i;
    if (!bySession.has(e.session_id)) bySession.set(e.session_id, []);
    bySession.get(e.session_id).push(e);
  });

  const sortMode = document.getElementById("sort").value;
  sessionsSorted = Array.from(bySession.entries()).map(([sid, evs]) => {
    return [sid, evs, summarizeSession(evs)];
  }).sort((a, b) => {
    if (sortMode === "tokens") return b[2].totalTokens - a[2].totalTokens;
    if (sortMode === "duration") return (b[2].lastTs - b[2].firstTs) - (a[2].lastTs - a[2].firstTs);
    return b[2].lastTs - a[2].lastTs;
  });

  const safe = (fn, name) => { try { fn(); } catch (e) { console.error(name, e); } };
  safe(refreshProjectSelect,          "refreshProjectSelect");
  safe(renderSidebar,                 "renderSidebar");
  safe(() => renderCanvas(newFromIndex), "renderCanvas");
  safe(renderDetailIfSession,         "renderDetailIfSession");
  if (currentPage === "summary") safe(renderSummary, "renderSummary");
}

function renderSidebar() {
  // Update source dropdown labels with per-source counts.
  const counts = { all: sessionsSorted.length, desktop: 0, cli: 0 };
  for (const [, , s] of sessionsSorted) counts[s.source] = (counts[s.source] || 0) + 1;
  const srcSel = document.getElementById("source");
  for (const opt of srcSel.options) {
    const base = { all: "All", desktop: "Desktop app", cli: "Terminal CLI" }[opt.value] || opt.value;
    opt.textContent = base + " (" + (counts[opt.value] || 0) + ")";
  }

  const list = document.getElementById("sess-list");
  list.innerHTML = "";

  const filtered = sessionsAfterFilters();
  const projSel = document.getElementById("project");
  const projFilter = projSel.value;
  const srcVal = srcSel.value;

  const allLabel = srcVal === "all" ? "All conversations" :
                    srcVal === "desktop" ? "All desktop app" : "All terminal CLI";
  const allArea = document.createElement("div");
  allArea.className = "all-item-area";
  const all = document.createElement("div");
  all.className = "sess-item all-item" + (selectedSessionId === null ? " active" : "");
  all.innerHTML = '<div class="sess-title"></div>' +
                  '<div class="sess-meta"><span>' + filtered.length + ' total</span></div>';
  all.querySelector(".sess-title").textContent = allLabel;
  all.onclick = () => { selectedSessionId = null; selectedNodeId = null;
                        renderSidebar(); renderCanvas(0); renderDetailIfSession(); };
  allArea.appendChild(all);
  list.appendChild(allArea);

  // Group by project when no specific project is filtered
  const shouldGroup = projFilter === "all";
  const byProj = new Map();
  for (const row of filtered) {
    const p = row[2].project;
    if (!byProj.has(p)) byProj.set(p, []);
    byProj.get(p).push(row);
  }
  const projNames = Array.from(byProj.keys()).sort((a, b) => {
    if (a === "No folder") return 1;
    if (b === "No folder") return -1;
    return a.localeCompare(b);
  });

  if (shouldGroup) {
    for (const p of projNames) {
      const isCollapsed = collapsedProjects.has(p);
      const header = document.createElement("div");
      header.className = "proj-header" + (isCollapsed ? " collapsed" : "");
      header.innerHTML = '<span class="proj-left"><span class="proj-chevron">&#x25BE;</span><span class="proj-name"></span></span><span class="count">' + byProj.get(p).length + '</span>';
      header.querySelector(".proj-name").textContent = p;
      header.onclick = () => {
        if (collapsedProjects.has(p)) collapsedProjects.delete(p);
        else collapsedProjects.add(p);
        renderSidebar();
      };
      list.appendChild(header);
      if (!isCollapsed) {
        for (const row of byProj.get(p)) appendSessionItem(list, row);
      }
    }
  } else {
    for (const row of filtered) appendSessionItem(list, row);
  }
}

function appendSessionItem(list, row) {
  const [sid, , s] = row;
  const item = document.createElement("div");
  item.className = "sess-item" + (selectedSessionId === sid ? " active" : "");
  const badge = s.source === "desktop" ? "app" : "cli";
  let modelPart = "";
  if (s.primaryModel) {
    const label = prettyModel(s.primaryModel);
    modelPart = '<span class="meta-model">' + (s.modelsSorted.length > 1
                            ? escapeHtml(label) + " +" + (s.modelsSorted.length - 1)
                            : escapeHtml(label)) + '</span>';
  }
  item.innerHTML =
    '<div class="sess-title"></div>' +
    '<div class="sess-meta">' +
      '<span>' + badge + '</span>' +
      '<span>' + fmtRel(s.lastTs) + '</span>' +
      modelPart +
      '<span class="meta-actions">' + s.tools + ' action' + (s.tools === 1 ? '' : 's') + '</span>' +
      '<span class="meta-tokens" title="New tokens only, excludes reused cache">' + fmtNum(s.freshTokens) + ' tok</span>' +
    '</div>';
  item.querySelector(".sess-title").textContent = s.title;
  item.onclick = () => {
    selectedSessionId = sid;
    selectedNodeId = null;
    renderSidebar(); renderCanvas(0); renderDetailIfSession();
  };
  list.appendChild(item);
}

let tlScrollLeft = new Map();   // promptId -> saved horizontal scroll of its timeline

function renderCanvas(newFromIndex) {
  const canvas = document.getElementById("canvas");

  // Remember how far each open timeline was scrolled before we wipe and rebuild the DOM.
  canvas.querySelectorAll(".prompt-group[data-prompt-id]").forEach(pg => {
    const tw = pg.querySelector(".tl-wrap");
    if (tw) tlScrollLeft.set(pg.dataset.promptId, tw.scrollLeft);
  });

  canvas.innerHTML = "";
  let filtered = selectedSessionId
    ? sessionsSorted.filter(([sid]) => sid === selectedSessionId)
    : sessionsAfterFilters();

  const canvasSortEl = document.getElementById("canvasSort");
  const canvasSortMode = canvasSortEl ? canvasSortEl.value : "latest";

  if (!selectedSessionId) {
    filtered = filtered.slice().sort((a, b) => {
      if (canvasSortMode === "tokens") return b[2].totalTokens - a[2].totalTokens;
      if (canvasSortMode === "duration") return (b[2].lastTs - b[2].firstTs) - (a[2].lastTs - a[2].firstTs);
      return b[2].lastTs - a[2].lastTs;
    });
  }

  let idx = 0;
  for (const [sid, evs, s] of filtered) {
    const wrap = document.createElement("div");
    wrap.className = "session";
    const t = document.createElement("div");
    t.className = "session-title";
    t.textContent = s.title;
    wrap.appendChild(t);
    const meta = document.createElement("div");
    meta.className = "session-stats";
    meta.textContent = fmtRel(s.lastTs) + " • " + s.prompts + " prompt(s) • " +
                       s.tools + " action" + (s.tools === 1 ? "" : "s") +
                       " • " + fmtNum(s.freshTokens) + " new tokens";
    wrap.appendChild(meta);
    wrap.appendChild(drawTree(evs, newFromIndex, sid, canvasSortMode));
    canvas.appendChild(wrap);
    idx++;
  }

  // Now that everything is attached to the DOM, restore each timeline's scroll
  // position - or, if it's newly opened, jump it to the far right (latest action).
  canvas.querySelectorAll(".prompt-group[data-prompt-id]").forEach(pg => {
    const tw = pg.querySelector(".tl-wrap");
    if (!tw) return;
    const pid = pg.dataset.promptId;
    tw.scrollLeft = tlScrollLeft.has(pid) ? tlScrollLeft.get(pid) : tw.scrollWidth;
  });
}

function renderDetailIfSession() {
  if (selectedNodeId) return;  // node detail was set on click, leave it
  if (selectedSessionId) {
    const found = sessionsSorted.find(([sid]) => sid === selectedSessionId);
    if (found) { showSessionDetail(found[2]); return; }
  }
  showAggregateDetail();
}

function showAggregateDetail() {
  const src  = document.getElementById("source").value;
  const proj = document.getElementById("project").value;
  const inScope = sessionsAfterFilters();

  if (inScope.length === 0) {
    document.getElementById("detail").innerHTML =
      '<em style="color:var(--muted)">No conversations in the current filter.</em>';
    return;
  }

  const agg = { convs: inScope.length, prompts: 0, turns: 0, tools: 0,
                inTok: 0, outTok: 0, cacheCreate: 0, cacheRead: 0, thinking: 0,
                total: 0, first: Infinity, last: 0, desktop: 0, cli: 0 };
  for (const [, , s] of inScope) {
    agg.prompts += s.prompts; agg.turns += s.turns; agg.tools += s.tools;
    agg.inTok += s.inTok; agg.outTok += s.outTok;
    agg.cacheCreate += s.cacheCreate; agg.cacheRead += s.cacheRead;
    agg.thinking += s.thinking; agg.total += s.totalTokens;
    if (s.firstTs < agg.first) agg.first = s.firstTs;
    if (s.lastTs > agg.last)   agg.last  = s.lastTs;
    if (s.source === "desktop") agg.desktop++; else agg.cli++;
  }

  const srcPart  = src  === "all" ? "All sources" : src === "desktop" ? "Desktop app" : "Terminal CLI";
  const projPart = proj === "all" ? "all projects" : proj;
  const scopeLabel = srcPart + " · " + projPart;
  const rows = [
    ["Scope",           scopeLabel],
    ["Conversations",   agg.convs],
    ["  Desktop app",   agg.desktop],
    ["  Terminal CLI",  agg.cli],
    ["Earliest",        new Date(agg.first * 1000).toLocaleString()],
    ["Latest",          fmtRel(agg.last)],
    ["",                ""],
    ["User prompts",    agg.prompts],
    ["Assistant turns", agg.turns],
    ["Actions",         agg.tools],
    ["",                ""],
    ["Input tokens",    fmtNum(agg.inTok)],
    ["Output tokens",   fmtNum(agg.outTok)],
    ["Cache created",   fmtNum(agg.cacheCreate)],
    ["Cache read",      fmtNum(agg.cacheRead)],
    ["Thinking",        fmtNum(agg.thinking)],
    ["Total tokens",    fmtNum(agg.total)],
  ];
  renderStatGrid(rows);
}

function renderStatGrid(rows) {
  const d = document.getElementById("detail");
  let html = '<div class="stat-grid">';
  for (const [k, v] of rows) {
    if (k === "") { html += '<div style="grid-column:1/-1;border-top:1px solid var(--edge);margin:6px 0"></div>'; continue; }
    html += '<div class="k">' + k + '</div><div class="v"></div>';
  }
  html += '</div>';
  d.innerHTML = html;
  const vals = d.querySelectorAll(".v");
  let i = 0;
  for (const [k, v] of rows) { if (k === "") continue; vals[i++].textContent = v; }
}

function showSessionDetail(s) {
  const rows = [
    ["Title",           s.title],
    ["Started",         new Date(s.firstTs * 1000).toLocaleString()],
    ["Last activity",   fmtRel(s.lastTs)],
    ["User prompts",    s.prompts],
    ["Assistant turns", s.turns],
    ["Actions",         s.tools],
  ];
  if (s.modelsSorted && s.modelsSorted.length) {
    rows.push(["", ""]);
    rows.push(["Models used", ""]);
    for (const [name, count] of s.modelsSorted) {
      rows.push(["  " + prettyModel(name), count + " turn" + (count === 1 ? "" : "s")]);
    }
  }
  if (s.effortsSorted && s.effortsSorted.length) {
    rows.push(["", ""]);
    rows.push(["Effort levels", ""]);
    for (const [level, count] of s.effortsSorted) {
      const label = level.charAt(0).toUpperCase() + level.slice(1);
      rows.push(["  " + label, count + " turn" + (count === 1 ? "" : "s")]);
    }
  }
  rows.push(["",                ""]);
  rows.push(["Input tokens",    fmtNum(s.inTok)]);
  rows.push(["Output tokens",   fmtNum(s.outTok)]);
  rows.push(["Cache created",   fmtNum(s.cacheCreate)]);
  rows.push(["Cache read",      fmtNum(s.cacheRead)]);
  rows.push(["Thinking",        fmtNum(s.thinking)]);
  rows.push(["Total",           fmtNum(s.totalTokens)]);
  renderStatGrid(rows);
}

function shorten(s, n) { s = String(s).replace(/\s+/g, " ").trim(); return s.length <= n ? s : s.slice(0, n-1) + "…"; }

let usageData = null;   // { fh: percent used 0-100, sd: percent used 0-100 } or null until loaded

function renderUsageLimits() {
  if (!usageData) {
    return '<div class="usage-limits"><em style="color:var(--muted);font-size:12px">Loading plan usage…</em></div>';
  }
  const bar = (label, usedPct, hint) => {
    const pct = Math.max(0, Math.min(100, usedPct));
    const cls = pct >= 90 ? "danger" : pct >= 70 ? "warn" : "";
    return '<div class="usage-limit">' +
      '<div class="usage-limit-head"><span class="usage-limit-label">' + label + '</span>' +
      '<span class="usage-limit-pct ' + cls + '">' + Math.round(pct) + '% used</span></div>' +
      '<div class="usage-limit-bar"><div class="' + cls + '" style="width:' + pct + '%"></div></div>' +
      '<div class="usage-limit-hint">' + hint + '</div>' +
    '</div>';
  };
  return '<div class="usage-limits">' +
    bar("Current session (5h)", usageData.fh, "Resets a few hours after your first message in the window") +
    bar("Weekly limit", usageData.sd, "Resets on your plan's weekly cycle") +
  '</div>';
}

async function fetchUsage() {
  let nextDelay = 60000;
  try {
    const r = await fetch("/usage.json", { cache: "no-store" });
    const d = await r.json();
    if (typeof d.fh === "number" && typeof d.sd === "number") {
      const changed = !usageData || usageData.fh !== d.fh || usageData.sd !== d.sd;
      usageData = { fh: d.fh, sd: d.sd };
      if (changed && currentPage === "summary") renderSummary();
    } else if (!usageData) {
      nextDelay = 5000;   // not written yet - retry soon
    }
  } catch (e) {
    nextDelay = usageData ? 30000 : 5000;
  }
  setTimeout(fetchUsage, nextDelay);
}

function currentRangeLabel() {
  const raw = document.getElementById("hours").value;
  const labels = { "today": "today", "1": "the last hour", "6": "the last 6 hours",
                   "24": "the last 24 hours", "168": "the last 7 days", "0": "all history" };
  return labels[raw] || ("the last " + raw + " hours");

function activityForPrompt(text) {
  const s = String(text || '').toLowerCase();
  const rules = [
    ['Debugging',      /\b(bug|debug|crash(?:ed|ing)?|error|exception|stack trace|traceback|doesn'?t work|isn'?t work(?:ing)?|not work(?:ing)?|broken|fails?|failing|failure|why (?:does|is|isn'?t|doesn'?t)|reproduce|root cause)\b/],
    ['Design & UI',    /\b(design|style|styling|css|colou?r|colou?rs|palette|layout|theme|themed|font|typography|ui|ux|icon|logo|responsive|dark mode|light mode|animation|hover|button|spacing|padding|margin)\b/],
    ['Building',       /\b(build|creates?|created?|creating|add(?:ed|ing)?|make|makes?|making|implement(?:s|ed|ing)?|generate|generat(?:es|ed|ing)|set ?up|new (?:feature|file|script|page|component|function|endpoint|tool)|scaffold)\b/],
    ['Editing',        /\b(edit|update|updat(?:es|ed|ing)|chang(?:e|es|ed|ing)|modify|modif(?:ies|ied|ying)|tweak|adjust|refactor|rename|swap|replace|remove|delete|clean ?up|simplify|reorgani[sz]e|move|fix(?:ed|ing)?)\b/],
    ['Coding',         /\b(code|function|class|method|script|api|system|component|unity|unreal|c#|c\+\+|python|javascript|typescript|powershell|regex|algorithm|logic|variable|loop|array|object)\b/],
    ['Research',       /\b(research|compare|explain|how does|how do|what is|what are|documentation|docs|look up|lookup|find out|investigate|difference between)\b/],
    ['Planning',       /\b(plan|planning|architecture|roadmap|approach|strategy|structure|design a system|think through|figure out how)\b/],
    ['Writing',        /\b(write|rewrite|draft|email|caption|essay|copy|proofread|summar(?:y|ize|ise)|readme|documentation for)\b/],
  ];
  for (const [name, rx] of rules) if (rx.test(s)) return name;
  return 'Other';
}

function modelTier(modelId) {
  const s = String(modelId || '').toLowerCase();
  if (/opus/.test(s))   return 3;
  if (/sonnet/.test(s)) return 2;
  if (/fable/.test(s))  return 2;
  if (/haiku/.test(s))  return 1;
  return 2;
}
function tierName(tier) { return tier >= 3 ? 'Opus' : tier === 2 ? 'Sonnet' : 'Haiku'; }

function recommendModel(modelTurns, modelTokens, avgTokens, avgTools) {
  const entries = Object.keys(modelTurns).map(m => {
    const turns = modelTurns[m];
    const tokens = modelTokens[m] || 0;
    return { model: m, turns, tokens, avg: tokens / Math.max(1, turns), tier: modelTier(m) };
  });
  if (!entries.length) return null;

  const primary = entries.slice().sort((a, b) => b.turns - a.turns)[0];
  const heaviest = entries.filter(e => e.turns >= 2).sort((a, b) => b.avg - a.avg)[0] || primary;

  // Heavy turns being handled by a lighter-tier model - Opus tends to reason more
  // thoroughly on large, complex context.
  if (heaviest.tier < 3 && heaviest.avg > 25000) {
    return {
      icon: '↑', tone: 'up', suggested: 'Opus',
      headline: 'Your heaviest turns could use Opus.',
      copy: prettyModel(heaviest.model) + ' is averaging ' + fmtNum(heaviest.avg) +
            ' tokens per turn on your biggest prompts. For genuinely complex, high-context work, Opus tends to reason more thoroughly - worth switching for sessions like these.'
    };
  }

  // Mostly light, simple prompts running on the top tier - a lighter model would
  // likely be just as capable and faster.
  if (primary.tier >= 3 && avgTokens > 0 && avgTokens < 8000 && avgTools < 3) {
    return {
      icon: '↓', tone: 'down', suggested: 'Sonnet or Haiku',
      headline: 'Most of your prompts are lightweight for Opus.',
      copy: 'Your average turn is only ' + fmtNum(avgTokens) + ' tokens with ' + avgTools.toFixed(1) +
            ' tool call(s) per prompt. Sonnet or Haiku would likely handle work like this just as well, and faster.'
    };
  }

  return {
    icon: '✓', tone: 'ok', suggested: tierName(primary.tier),
    headline: prettyModel(primary.model) + ' looks like a good match.',
    copy: 'Based on your average context size (' + fmtNum(avgTokens) + ' tokens/turn) and tool usage (' +
          avgTools.toFixed(1) + ' calls/prompt), your current model choice fits your usage pattern well.'
  };
}

// Compares models on tokens spent per action completed - a rough proxy for
// "getting more done for less" when you've used more than one model. This
// says nothing about output quality, only cost efficiency.
function compareModelEfficiency(modelTurns, modelTokens, modelActions) {
  const entries = Object.keys(modelTurns)
    .filter(m => modelTurns[m] >= 3)   // ignore one-off/stray turns, too noisy
    .map(m => {
      const turns = modelTurns[m];
      const tokens = modelTokens[m] || 0;
      const actions = modelActions[m] || 0;
      return {
        model: m,
        turns, tokens, actions,
        tokensPerTurn: tokens / Math.max(1, turns),
        tokensPerAction: actions > 0 ? tokens / actions : null
      };
    });
  if (entries.length < 2) return null;

  // Prefer comparing on tokens-per-action when every candidate actually has
  // actions to compare; otherwise fall back to tokens-per-turn.
  const canCompareActions = entries.every(e => e.tokensPerAction !== null);
  const metric = canCompareActions ? 'tokensPerAction' : 'tokensPerTurn';
  const ranked = entries.slice().sort((a, b) => a[metric] - b[metric]);
  const cheapest = ranked[0];
  const priciest = ranked[ranked.length - 1];
  if (cheapest.model === priciest.model || priciest[metric] <= 0) return null;

  const diffPct = Math.round((1 - cheapest[metric] / priciest[metric]) * 100);
  if (diffPct < 15) return null;   // too close to be a meaningful difference

  const unit = metric === 'tokensPerAction' ? 'tokens/action' : 'tokens/turn';
  return {
    cheapest, priciest, metric, diffPct, unit,
    headline: prettyModel(cheapest.model) + ' used ' + diffPct + '% fewer ' + unit +
              ' than ' + prettyModel(priciest.model) + ' in this time window.',
    copy: prettyModel(cheapest.model) + ': ' + fmtNum(Math.round(cheapest[metric])) + ' ' + unit +
          ' · ' + prettyModel(priciest.model) + ': ' + fmtNum(Math.round(priciest[metric])) + ' ' + unit +
          '. This compares token cost only, not output quality.'
  };
}

// Flags when High-effort turns look, on average, "simple" - low fresh-token
// cost and few actions per turn - suggesting Medium/Low would likely have
// been enough for at least some of that work.
function findOvereffortInsight(effortTurns, effortFreshTokens, effortActions) {
  const highTurns = effortTurns['high'] || 0;
  if (highTurns < 3) return null;

  const avgFresh = (effortFreshTokens['high'] || 0) / highTurns;
  const avgActions = (effortActions['high'] || 0) / highTurns;
  if (avgFresh >= 8000 || avgActions > 2) return null;   // genuinely substantial work, not overkill

  return {
    headline: 'High effort was used on ' + highTurns + ' fairly simple turn' + (highTurns === 1 ? '' : 's') + '.',
    copy: 'Those turns averaged only ' + fmtNum(Math.round(avgFresh)) + ' fresh tokens and ' + avgActions.toFixed(1) +
          ' action(s) each. For requests like that, Medium or Low effort would likely produce the same result for less cost.'
  };
}

function calcUsageScore(agg, activity, projectRows, duplicateCalls, effortTurns, effortFreshTokens, effortActions) {
  // This is a transparent heuristic, not a claim that there is one objectively
  // correct way to use an AI assistant. Points: cache 22, context 18, tools 18,
  // concentration 10, duplicate actions 12, effort-vs-complexity match 12, base 8.
  // "Fresh" work excludes cache reads - reused context grows naturally over a
  // long conversation and isn't reprocessed, so it's a poor signal for how
  // heavy a turn actually was. Judge context size on fresh tokens only.
  const freshTotal = agg.inTok + agg.outTok + agg.cacheCreate + agg.thinking;
  const cacheBase = agg.inTok + agg.cacheRead;
  const cacheRate = cacheBase ? agg.cacheRead / cacheBase : 0;
  const avgTools = agg.prompts ? agg.tools / agg.prompts : 0;
  const avgTokens = agg.turns ? freshTotal / agg.turns : freshTotal;
  const cachePoints = Math.min(22, cacheRate * 22);
  const contextPoints = avgTokens < 50000 ? 18 : avgTokens < 100000 ? 14 : avgTokens < 180000 ? 9 : 5;
  const toolPoints = avgTools < 6 ? 18 : avgTools < 10 ? 14 : avgTools < 16 ? 10 : 6;
  const concentration = projectRows.length ? projectRows[0].pct : 0;
  const concentrationPoints = concentration > 85 ? 4 : concentration > 65 ? 7 : 10;

  // Repeating the exact same action within a session usually means lost
  // context or backtracking, not new work - penalise a high duplicate rate.
  const dupRate = agg.tools ? (duplicateCalls || 0) / agg.tools : 0;
  const dupPoints = Math.max(0, 12 * (1 - Math.min(1, dupRate * 5)));

  // High reasoning effort spent on turns that look genuinely simple (few
  // actions, low fresh-token cost) suggests effort was set higher than the
  // work needed - penalise proportional to how much of total usage that is.
  let mismatchPoints = 12;
  const highTurns = (effortTurns && effortTurns['high']) || 0;
  if (highTurns >= 3) {
    const avgFresh = ((effortFreshTokens && effortFreshTokens['high']) || 0) / highTurns;
    const avgActions = ((effortActions && effortActions['high']) || 0) / highTurns;
    if (avgFresh < 8000 && avgActions <= 2) {
      const shareHigh = highTurns / Math.max(1, agg.turns);
      mismatchPoints = Math.max(0, 12 * (1 - shareHigh));
    }
  }

  return Math.max(0, Math.min(100, Math.round(
    cachePoints + contextPoints + toolPoints + concentrationPoints + dupPoints + mismatchPoints + 8
  )));
}

function looksLikeClarifyingQuestion(text) {
  if (!text || text.indexOf("?") === -1) return false;
  const rx = /(could you clarify|can you clarify|what do you mean|could you provide more|can you provide more|need more (info|information|detail|context)|which (one|file|approach|option)|not sure what you mean|could you elaborate|can you elaborate|to confirm|just to confirm|do you want me to|would you like me to|can you specify|could you specify|unclear (what|which)|before I (continue|proceed|start)|a few questions)/i;
  return rx.test(text);
}

function suggestionForPrompt(g, responseText, primaryEffort) {
  const dec = g.tools.length;
  const cacheShare = g.tokens > 0 ? g.cacheRead / g.tokens : 0;
  // "Fresh" work excludes cache reads - reused context isn't newly processed,
  // so it's a poor signal for "was this prompt expensive to answer".
  const freshTokens = g.inputTokens + g.outputTokens + g.cacheCreate + g.thinkingTokens;

  if (looksLikeClarifyingQuestion(responseText)) {
    return { tone: "bad", key: "clarification", label: "Needed clarification",
             text: "Claude had to ask for clarification here - providing more upfront context (files involved, the goal, any constraints) next time can avoid the back-and-forth." };
  }

  const seen = new Set();
  let dupTool = null;
  for (const t of g.tools) {
    const key = t.label + "|" + (t.event.tool_input || "");
    if (seen.has(key)) { dupTool = t.label; break; }
    seen.add(key);
  }
  if (dupTool) {
    return { tone: "bad", key: "duplicate", label: "Repeated actions",
             text: "Some actions repeated here (" + dupTool + ") - referencing earlier results instead of re-running them can save tokens." };
  }

  if (primaryEffort === "high" && dec <= 2 && freshTokens > 0 && freshTokens < 6000) {
    return { tone: "bad", key: "effort-mismatch", label: "High effort on a simple ask",
             text: "This used High effort for a fairly small, simple request (" + dec + " action" + (dec === 1 ? "" : "s") + ", " + fmtNum(freshTokens) + " fresh tokens) - Medium or Low effort would likely give the same result for less cost." };
  }

  if (g.tokens > 100000 && cacheShare > 0.6) {
    return { tone: "good", key: "cache-heavy-ok", label: "Large but cache-efficient",
             text: "This totalled " + fmtNum(g.tokens) + " tokens, but " + Math.round(cacheShare * 100) + "% (" + fmtNum(g.cacheRead) + ") came from cache reads - reused context from earlier in the conversation, not new processing. Only about " + fmtNum(freshTokens) + " tokens were fresh work across " + dec + " action" + (dec === 1 ? "" : "s") + ", which is reasonable for what it did." };
  }

  if (freshTokens > 40000) {
    return { tone: "bad", key: "large-context", label: "Large context exchange",
             text: "This was a large, context-heavy exchange (" + fmtNum(freshTokens) + " fresh tokens, excluding cache) - splitting it into smaller, focused asks can reduce repeated context." };
  }

  if (dec >= 8) {
    return { tone: "bad", key: "many-actions", label: "High action count",
             text: "This prompt needed " + dec + " actions - being more specific about which files or areas to focus on up front can reduce exploration." };
  }

  if (g.tokens > 0 && g.outputTokens > 3000 && (g.outputTokens / g.tokens) > 0.5) {
    return { tone: "bad", key: "verbose-output", label: "Verbose response",
             text: "The response here was quite long relative to the rest of the exchange - asking for a more concise answer next time can save tokens." };
  }

  return null;
}

// Rebuilds prompt groups from raw events with just the fields
// suggestionForPrompt() needs, for aggregating insights across many sessions
// without pulling in drawTree's UI-specific bookkeeping (DOM ids, timelines).
function groupPromptsForInsights(evs) {
  const groups = [];
  let current = null;
  const freshGroup = () => ({
    tools: [], efforts: new Map(), tokens: 0,
    inputTokens: 0, outputTokens: 0, cacheCreate: 0, cacheRead: 0, thinkingTokens: 0,
    responseParts: []
  });
  for (const e of evs) {
    if (e.event === "UserPromptSubmit") {
      current = freshGroup();
      groups.push(current);
    } else if (e.event === "PreToolUse") {
      if (!current) { current = freshGroup(); groups.push(current); }
      current.tools.push({ label: e.tool_name || "tool", event: e });
    } else if (e.event === "AssistantTurn") {
      if (!current) { current = freshGroup(); groups.push(current); }
      if (e.effort) current.efforts.set(e.effort, (current.efforts.get(e.effort) || 0) + 1);
      current.tokens += turnTokenTotal(e);
      current.inputTokens    += e.input_tokens || 0;
      current.outputTokens   += e.output_tokens || 0;
      current.cacheCreate    += e.cache_creation || 0;
      current.cacheRead      += e.cache_read || 0;
      current.thinkingTokens += e.thinking_tokens || 0;
      if (e.response_text) current.responseParts.push(e.response_text);
    }
  }
  return groups;
}

function computeSuggestionTally(inScope) {
  const tally = {};   // key -> { count, tone, label, sample }
  for (const [, evs] of inScope) {
    for (const g of groupPromptsForInsights(evs)) {
      const effortsSorted = Array.from(g.efforts.entries()).sort((a, b) => b[1] - a[1]);
      const primaryEffort = effortsSorted.length ? effortsSorted[0][0] : null;
      const responseText = g.responseParts.join("\n\n").trim();
      const suggestion = suggestionForPrompt(g, responseText, primaryEffort);
      if (!suggestion) continue;
      if (!tally[suggestion.key]) {
        tally[suggestion.key] = { count: 0, tone: suggestion.tone, label: suggestion.label, sample: suggestion.text };
      }
      tally[suggestion.key].count++;
    }
  }
  return Object.values(tally).sort((a, b) => b.count - a.count);
}

function computeTopOffendingPrompts(inScope, limit) {
  const prompts = [];
  for (const [sid, evs, s] of inScope) {
    let current = null;
    for (const e of evs) {
      if (e.event === "UserPromptSubmit") {
        current = { sid, sessionTitle: s.title, root: e, tokens: 0, decisions: 0, responseParts: [] };
        prompts.push(current);
      } else if (e.event === "PreToolUse") {
        if (!current) { current = { sid, sessionTitle: s.title, root: null, tokens: 0, decisions: 0, responseParts: [] }; prompts.push(current); }
        current.decisions++;
      } else if (e.event === "AssistantTurn") {
        if (!current) { current = { sid, sessionTitle: s.title, root: null, tokens: 0, decisions: 0, responseParts: [] }; prompts.push(current); }
        current.tokens += turnTokenTotal(e);
        if (e.response_text) current.responseParts.push(e.response_text);
      }
    }
  }
  for (const p of prompts) {
    p.needsClarity = looksLikeClarifyingQuestion(p.responseParts.join(" "));
  }
  return prompts.filter(p => p.root && p.tokens > 0)
                .sort((a, b) => b.tokens - a.tokens)
                .slice(0, limit || 3);
}
